<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>專業貸款還款試算機</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-8 px-4 sm:px-6 lg:px-8">
  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- 標頭 -->
    <header class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 flex items-center gap-3">
          <i class="fa-solid fa-calculator text-blue-600"></i>
          貸款還款試算機
        </h1>
        <p class="text-slate-500 text-sm mt-1">精確計算每期還款金額、利息總額與還款計劃表（自動儲存上次輸入）</p>
      </div>
      <div class="flex items-center gap-2">
        <span id="saved-badge" class="hidden text-xs bg-emerald-50 text-emerald-600 border border-emerald-200 px-3 py-1.5 rounded-full font-medium flex items-center gap-1.5">
          <i class="fa-solid fa-check text-xs"></i> 已載入上次輸入紀錄
        </span>
        <button id="btn-reset-default" class="text-xs text-slate-500 hover:text-slate-700 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg transition flex items-center gap-1">
          <i class="fa-solid fa-rotate-left"></i> 恢復預設值
        </button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- 左側：輸入表單 (5 欄) -->
      <section class="lg:col-span-5 bg-white rounded-2xl p-6 shadow-sm border border-slate-100 space-y-5">
        <h2 class="text-lg font-bold text-slate-800 border-b border-slate-100 pb-3 flex items-center gap-2">
          <i class="fa-solid fa-sliders text-blue-500"></i> 試算條件設定
        </h2>

        <!-- 貸款金額 -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1" for="loan-amount">
            貸款金額 (萬元)
          </label>
          <div class="relative">
            <input type="number" id="loan-amount" min="1" max="100000" step="1" value="1000"
              class="w-full pl-4 pr-12 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition font-medium text-slate-800">
            <span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm font-medium">萬元</span>
          </div>
          <!-- 快捷金額按鈕 -->
          <div class="flex flex-wrap gap-1.5 mt-2">
            <button type="button" class="btn-quick-amount text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-600 px-2.5 py-1 rounded-lg text-slate-600 transition" data-val="100">100萬</button>
            <button type="button" class="btn-quick-amount text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-600 px-2.5 py-1 rounded-lg text-slate-600 transition" data-val="500">500萬</button>
            <button type="button" class="btn-quick-amount text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-600 px-2.5 py-1 rounded-lg text-slate-600 transition" data-val="1000">1000萬</button>
            <button type="button" class="btn-quick-amount text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-600 px-2.5 py-1 rounded-lg text-slate-600 transition" data-val="1500">1500萬</button>
          </div>
        </div>

        <!-- 年利率 -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1" for="annual-rate">
            年利率 (%)
          </label>
          <div class="relative">
            <input type="number" id="annual-rate" min="0.01" max="30" step="0.01" value="2.15"
              class="w-full pl-4 pr-8 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition font-medium text-slate-800">
            <span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm font-medium">%</span>
          </div>
          <!-- 快捷利率預設 -->
          <div class="flex flex-wrap gap-1.5 mt-2">
            <button type="button" class="btn-quick-rate text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-600 px-2.5 py-1 rounded-lg text-slate-600 transition" data-val="2.185">新青安 2.185%</button>
            <button type="button" class="btn-quick-rate text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-600 px-2.5 py-1 rounded-lg text-slate-600 transition" data-val="2.15">首購房貸 2.15%</button>
            <button type="button" class="btn-quick-rate text-xs bg-slate-100 hover:bg-blue-50 hover:text-blue-600 px-2.5 py-1 rounded-lg text-slate-600 transition" data-val="3.5">信貸/車貸 3.5%</button>
          </div>
        </div>

        <!-- 還款年限與月數 -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-sm font-semibold text-slate-700" for="loan-years">還款期數</label>
            <span id="loan-months-text" class="text-xs text-blue-600 font-medium">共 360 期 (30年)</span>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div class="relative">
              <input type="number" id="loan-years" min="1" max="50" step="1" value="30"
                class="w-full pl-4 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition font-medium text-slate-8
