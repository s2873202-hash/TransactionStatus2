<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多平台交易損益紀錄與風控儀表板 (進階時間與截圖版)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js 圖表庫 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS (原生匯出 Excel .xlsx) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Firebase 8.x SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- 頁首標題與操作區 -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-emerald-400 flex items-center gap-2">
                    📊 多平台交易損益紀錄與風控儀表板
                </h1>
                <p class="text-slate-400 text-sm mt-1">追蹤各平台交易績效、進出場時間點位、期望值與資金曲線（含K線截圖與雲端同步）</p>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <label class="text-sm text-slate-300">統計月份：</label>
                <input type="month" id="monthFilter" onchange="renderApp()" class="bg-slate-700 text-white px-3 py-1.5 rounded-lg border border-slate-600 focus:outline-none focus:border-emerald-500">
                <button onclick="clearMonthFilter()" class="bg-slate-700 hover:bg-slate-600 text-xs text-slate-300 px-2.5 py-2 rounded-lg border border-slate-600 transition">顯示全部</button>

                <!-- 匯入與匯出按鈕 -->
                <button onclick="document.getElementById('importFileInput').click()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg text-sm border border-slate-600 transition">匯入 JSON</button>
                <input type="file" id="importFileInput" accept=".json" onchange="importData(event)" class="hidden">
                <button onclick="exportToExcel()" class="bg-emerald-700 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition shadow">📥 匯出 Excel (.xlsx)</button>
                <button onclick="exportData()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg text-sm border border-slate-600 transition">匯出 JSON</button>
            </div>
        </header>

        <!-- 頂部數據統計卡片區塊 -->
        <section class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md">
                <span class="text-slate-400 text-xs block font-medium">總交易筆數</span>
                <span id="statTotalCount" class="text-xl font-bold text-amber-400 mt-1 block">0 筆</span>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md">
                <span class="text-slate-400 text-xs block font-medium">勝率 (Win Rate)</span>
                <span id="statWinRate" class="text-xl font-bold text-indigo-400 mt-1 block">0.0 %</span>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md">
                <span class="text-slate-400 text-xs block font-medium">累積淨損益 (NTD)</span>
                <span id="statMonthlyPnL" class="text-xl font-extrabold text-slate-200 mt-1 block">$ 0</span>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md" title="平均獲利 / 平均虧損，建議高於 1.5">
                <span class="text-slate-400 text-xs block font-medium">平均盈虧比 (Payoff)</span>
                <span id="statPayoffRatio" class="text-xl font-bold text-amber-300 mt-1 block">0.00</span>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md" title="(勝率 * 平均獲利) - (敗率 * 平均虧損)">
                <span class="text-slate-400 text-xs block font-medium">每筆期望值 (EV)</span>
                <span id="statEV" class="text-xl font-bold text-sky-400 mt-1 block">$ 0</span>
            </div>
        </section>

        <!-- 主要區域：左側新增/編輯表單 | 右側各平台圖表 -->
        <main class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- 表單區區塊 -->
            <section class="lg:col-span-5 bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-md h-fit">
                <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
                    <h2 id="formTitle" class="text-lg font-semibold text-slate-200">➕ 新增交易紀錄</h2>
                    <button id="cancelEditBtn" onclick="resetForm()" class="hidden text-xs text-rose-400 hover:underline">取消編輯</button>
                </div>
                <form id="pnlForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                    <input type="hidden" id="editingId" value="">
                    
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">交易日期</label>
                            <input type="date" id="inputDate" required class="w-full bg-slate-700 text-white px-3 py-2 rounded-lg border border-slate-600 focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">交易平台/券商</label>
                            <input type="text" id="inputPlatform" placeholder="例如：統一證券、群益" list="platformOptions" required class="w-full bg-slate-700 text-white px-3 py-2 rounded-lg border border-slate-600 focus:outline-none focus:border-emerald-500">
                            <datalist id="platformOptions">
                                <option value="統一證券">
                                <option value="永豐證券">
                                <option value="群益期貨">
                                <option value="富邦證券">
                            </datalist>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-3">
                        <div class="col-span-2">
                            <label class="block text-xs text-slate-400 mb-1">交易標的 / 代號</label>
                            <input type="text" id="inputAsset" placeholder="例如：光頡、2330台積電" required class="w-full bg-slate-700 text-white px-3 py-2 rounded-lg border border-slate-600 focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">交易數量 (張)</label>
                            <input type="number" id="inputQuantity" placeholder="例如 1 或 5" min="0" step="any" class="w-full bg-slate-700 text-white px-3 py-2 rounded-lg border border-slate-600 focus:outline-none focus:border-emerald-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs text-slate-400 mb-1">交易策略分類</label>
                        <input type="text" id="inputStrategy" placeholder="例如：開盤突破、緩跌拉高不過高後空" list="strategyOptions" class="w-full bg-slate-700 text-white px-3 py-2 rounded-lg border border-slate-600 focus:outline-none focus:border-emerald-500">
                        <datalist id="strategyOptions">
                            <option value="開盤突破">
                            <option value="開盤衝高後跌破開盤價">
                            <option value="緩跌拉高不過高後空">
                            <option value="拉高空">
                            <option value="續弱">
                            <option value="其他/隨意進場">
                        </datalist>
                    </div>

                    <!-- 進出場時間點位區塊 -->
                    <div class="grid grid-cols-2 gap-3 p-3 bg-slate-700/40 rounded-lg border border-slate-700">
                        <div>
                            <label class="block text-xs text-emerald-400 mb-1">⏰ 進場時間</label>
                            <input type="time" id="inputEntryTime" class="w-full bg-slate-700 text-white px-3 py-1.5 rounded-lg border border-slate-600 text-xs focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-xs text-rose-400 mb-1">⏰ 出場時間</label>
                            <input type="time" id="inputExitTime" class="w-full bg-slate-700 text-white px-3 py-1.5 rounded-lg border border-slate-600 text-xs focus:outline-none focus:border-rose-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 p-3 bg-slate-700/40 rounded-lg border border-slate-700">
                        <div>
                            <label class="block text-xs text-emerald-400 mb-1">進場價格 (Entry)</label>
                            <input type="number" id="inputEntryPrice" placeholder="例如 163" min="0" step="any" class="w-full bg-slate-700 text-white px-3 py-1.5 rounded-lg border border-slate-600 text-xs focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-xs text-rose-400 mb-1">出場價格 (Exit)</label>
                            <input type="number" id="inputExitPrice" placeholder="例如 169" min="0" step="any" class="w-full bg-slate-700 text-white px-3 py-1.5 rounded-lg border border-slate-600 text-xs focus:outline-none focus:border-rose-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs text-slate-400 mb-1">實際淨損益 (已含手續費與稅，可為負)</label>
                        <input type="number" id="inputPnL" placeholder="15000 或 -3000" step="any" required class="w-full bg-slate-700 text-white px-3 py-2 rounded-lg border border-slate-600 focus:outline-none focus:border-emerald-500 font-bold">
                    </div>

                    <div>
                        <label class="block text-xs text-slate-400 mb-1">交易檢討 / 策略備註</label>
                        <textarea id="inputNote" rows="2" placeholder="為什麼賺或賠？檢討停損紀律..." class="w-full bg-slate-700 text-white px-3 py-2 rounded-lg border border-slate-600 focus:outline-none focus:border-emerald-500 text-sm"></textarea>
                    </div>

                    <!-- 上傳當日日線/分K走勢截圖功能 -->
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">📷 上傳當日日線/分K走勢截圖 (選填)</label>
                        <input type="file" id="inputImageFile" accept="image/*" onchange="handleImageUpload(event)" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-slate-200 hover:file:bg-slate-600">
                        <input type="hidden" id="inputImageBase64" value="">
                        <div id="imagePreviewContainer" class="mt-2 hidden relative">
                            <img id="imagePreview" src="" alt="截圖預覽" class="max-h-32 rounded-lg border border-slate-600">
                            <button type="button" onclick="clearImage()" class="absolute top-1 left-1 bg-rose-600 text-white text-xs px-1.5 py-0.5 rounded shadow">移除圖片</button>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-lg transition shadow-md">
                        💾 儲存紀錄 (同步雲端)
                    </button>
                </form>
            </section>

            <!-- 各平台損益分佈圖表 -->
            <section class="lg:col-span-7 bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-md flex flex-col">
                <h2 class="text-lg font-semibold text-slate-200 mb-4 border-b border-slate-700 pb-2">📈 各平台當期淨損益</h2>
                <div class="flex-1 min-h-[260px] relative">
                    <canvas id="platformChart"></canvas>
                </div>
            </section>
        </main>

        <!-- 每日累計損益資金曲線圖 -->
        <section class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-md">
            <h2 class="text-lg font-semibold text-slate-200 mb-4 border-b border-slate-700 pb-2">📉 每日累計損益資金曲線</h2>
            <div class="h-[280px] relative">
                <canvas id="dailyCumulativeChart"></canvas>
            </div>
        </section>

        <!-- 歷史紀錄明細列表 -->
        <section class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-md">
            <h2 class="text-lg font-semibold text-slate-200 mb-4 border-b border-slate-700 pb-2">📋 交易明細清單</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="text-xs text-slate-400 border-b border-slate-700">
                            <th class="py-3 px-3">日期</th>
                            <th class="py-3 px-3">平台</th>
                            <th class="py-3 px-3">標的/數量/策略</th>
                            <th class="py-3 px-3 text-center">進出時間 / 價格</th>
                            <th class="py-3 px-3 text-right">淨損益</th>
                            <th class="py-3 px-3">備註/截圖</th>
                            <th class="py-3 px-3 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="recordsTableBody" class="divide-y divide-slate-700/50 text-sm">
                        <!-- 資料會以 JS 動態渲染 -->
                    </tbody>
                </table>
            </div>
        </section>

    </div>

    <!-- 備註與截圖檢視 Modal 彈窗 -->
    <div id="noteModal" class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-2xl w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <h3 class="text-lg font-bold text-emerald-400 mb-2">📝 交易策略、檢討與K線截圖</h3>
            <div id="modalDateAsset" class="text-xs text-slate-400 mb-4"></div>
            <div id="modalNoteContent" class="bg-slate-900/80 p-4 rounded-lg border border-slate-700/60 text-slate-200 text-sm leading-relaxed whitespace-pre-wrap mb-4"></div>
            <div id="modalImageContainer" class="hidden mb-4">
                <p class="text-xs text-slate-400 mb-2">走勢圖表參考：</p>
                <img id="modalImage" src="" alt="K線截圖" class="rounded-lg border border-slate-600 max-h-96 mx-auto">
            </div>
            <div class="mt-6 flex justify-end">
                <button onclick="closeNoteModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-lg text-sm transition">關閉</button>
            </div>
        </div>
    </div>

    <script>
        // 1. Firebase 配置金鑰
        const firebaseConfig = {
            apiKey: "AIzaSyCWx0lVV819nGYeEyCJ9ZSbJhAUqGCO5Ro",
            authDomain: "loan-867b2.firebaseapp.com",
            databaseURL: "https://loan-867b2-default-rtdb.firebaseio.com",
            projectId: "loan-867b2",
            storageBucket: "loan-867b2.firebasestorage.app",
            messagingSenderId: "512494811629",
            appId: "1:512494811629:web:c6ea74cf201b79c6850fe4",
            measurementId: "G-G0EFH9FLB5"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const recordsRef = db.ref('pnl_records');

        let records = [];
        let chartInstance = null;
        let dailyCumulativeChartInstance = null;

        // 2. 初始化與 Firebase 監聽
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            const yearMonth = today.toISOString().slice(0, 7);
            document.getElementById('monthFilter').value = yearMonth;
            document.getElementById('inputDate').value = today.toISOString().slice(0, 10);

            recordsRef.on('value', (snapshot) => {
                const cloudData = snapshot.val();
                const localData = JSON.parse(localStorage.getItem('pnl_tracker_records'));

                if (!cloudData && localData && localData.length > 0) {
                    records = localData;
                    saveData();
                } else if (cloudData) {
                    records = Array.isArray(cloudData) ? cloudData : Object.values(cloudData);
                } else {
                    records = [];
                }

                localStorage.setItem('pnl_tracker_records', JSON.stringify(records));
                renderApp();
            });
        });

        function saveData() {
            recordsRef.set(records);
            localStorage.setItem('pnl_tracker_records', JSON.stringify(records));
        }

        // 圖片上傳轉 Base64
        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
                const base64Str = uploadEvent.target.result;
                document.getElementById('inputImageBase64').value = base64Str;
                document.getElementById('imagePreview').src = base64Str;
                document.getElementById('imagePreviewContainer').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function clearImage() {
            document.getElementById('inputImageBase64').value = '';
            document.getElementById('inputImageFile').value = '';
            document.getElementById('imagePreviewContainer').classList.add('hidden');
            document.getElementById('imagePreview').src = '';
        }

        // 3. 表單送出 (新增/編輯)
        function handleFormSubmit(e) {
            e.preventDefault();
            
            const editingId = document.getElementById('editingId').value;
            const recordData = {
                id: editingId || Date.now().toString(),
                date: document.getElementById('inputDate').value,
                platform: document.getElementById('inputPlatform').value.trim(),
                asset: document.getElementById('inputAsset').value.trim(),
                quantity: parseFloat(document.getElementById('inputQuantity').value) || 0,
                strategy: document.getElementById('inputStrategy').value.trim() || '其他/隨意進場',
                pnl: parseFloat(document.getElementById('inputPnL').value) || 0, // 直接代表淨損益
                entryTime: document.getElementById('inputEntryTime').value || '',
                exitTime: document.getElementById('inputExitTime').value || '',
                entryPrice: parseFloat(document.getElementById('inputEntryPrice').value) || 0,
                exitPrice: parseFloat(document.getElementById('inputExitPrice').value) || 0,
                note: document.getElementById('inputNote').value.trim(),
                imageBase64: document.getElementById('inputImageBase64').value || ''
            };

            if (editingId) {
                const idx = records.findIndex(r => r.id === editingId);
                if (idx !== -1) {
                    if (!recordData.imageBase64 && records[idx].imageBase64) {
                        recordData.imageBase64 = records[idx].imageBase64;
                    }
                    records[idx] = recordData;
                }
            } else {
                records.push(recordData);
            }

            saveData();
            
            const recordMonth = recordData.date.slice(0, 7);
            document.getElementById('monthFilter').value = recordMonth;

            resetForm();
            renderApp();
        }

        function editRecord(id) {
            const record = records.find(r => r.id === id);
            if (!record) return;

            document.getElementById('editingId').value = record.id;
            document.getElementById('inputDate').value = record.date;
            document.getElementById('inputPlatform').value = record.platform;
            document.getElementById('inputAsset').value = record.asset;
            document.getElementById('inputQuantity').value = record.quantity || '';
            document.getElementById('inputStrategy').value = record.strategy || '';
            document.getElementById('inputPnL').value = record.pnl;
            document.getElementById('inputEntryTime').value = record.entryTime || '';
            document.getElementById('inputExitTime').value = record.exitTime || '';
            document.getElementById('inputEntryPrice').value = record.entryPrice || '';
            document.getElementById('inputExitPrice').value = record.exitPrice || '';
            document.getElementById('inputNote').value = record.note || '';
            
            if (record.imageBase64) {
                document.getElementById('inputImageBase64').value = record.imageBase64;
                document.getElementById('imagePreview').src = record.imageBase64;
                document.getElementById('imagePreviewContainer').classList.remove('hidden');
            } else {
                clearImage();
            }

            document.getElementById('formTitle').textContent = '✏️ 編輯交易紀錄';
            document.getElementById('submitBtn').textContent = '更新紀錄';
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('editingId').value = '';
            document.getElementById('formTitle').textContent = '➕ 新增交易紀錄';
            document.getElementById('submitBtn').textContent = '💾 儲存紀錄 (同步雲端)';
            document.getElementById('cancelEditBtn').classList.add('hidden');
            
            document.getElementById('inputAsset').value = '';
            document.getElementById('inputQuantity').value = '';
            document.getElementById('inputStrategy').value = '';
            document.getElementById('inputPnL').value = '';
            document.getElementById('inputEntryTime').value = '';
            document.getElementById('inputExitTime').value = '';
            document.getElementById('inputEntryPrice').value = '';
            document.getElementById('inputExitPrice').value = '';
            document.getElementById('inputNote').value = '';
            document.getElementById('inputDate').value = new Date().toISOString().slice(0, 10);
            clearImage();
        }

        function deleteRecord(id) {
            if (confirm('確定要刪除這筆紀錄嗎？')) {
                records = records.filter(r => r.id !== id);
                saveData();
                renderApp();
            }
        }

        function clearMonthFilter() {
            document.getElementById('monthFilter').value = '';
            renderApp();
        }

        // 4. Excel 與 JSON 匯入/匯出
        function exportToExcel() {
            if (!records || records.length === 0) {
                alert('目前沒有交易紀錄可供匯出！');
                return;
            }

            const excelData = records.map(r => ({
                "交易日期": r.date,
                "券商平台": r.platform,
                "交易標的": r.asset,
                "交易數量": r.quantity || 0,
                "策略分類": r.strategy || '未指定',
                "進場時間": r.entryTime || '',
                "出場時間": r.exitTime || '',
                "淨損益 (NTD)": r.pnl,
                "進場價格": r.entryPrice || 0,
                "出場價格": r.exitPrice || 0,
                "交易檢討與備註": r.note || ''
            }));

            const worksheet = XLSX.utils.json_to_sheet(excelData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "交易明細日誌");

            worksheet['!cols'] = [
                { wch: 12 }, { wch: 12 }, { wch: 15 }, { wch: 10 },
                { wch: 14 }, { wch: 10 }, { wch: 10 }, { wch: 14 },
                { wch: 12 }, { wch: 12 }, { wch: 30 }
            ];

            const dateStr = new Date().toISOString().slice(0, 10);
            XLSX.writeFile(workbook, `交易日誌紀錄_${dateStr}.xlsx`);
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(records, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `pnl_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(dlAnchorElem);
            dlAnchorElem.click();
            dlAnchorElem.remove();
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    let importedRecords = JSON.parse(event.target.result);

                    if (!Array.isArray(importedRecords) && typeof importedRecords === 'object') {
                        const possibleKeys = ['records', 'data'];
                        const foundKey = possibleKeys.find(k => Array.isArray(importedRecords[k])) || 
                                                 Object.keys(importedRecords).find(key => Array.isArray(importedRecords[key]));
                        if (foundKey) importedRecords = importedRecords[foundKey];
                    }

                    if (Array.isArray(importedRecords)) {
                        records = importedRecords.map(item => ({
                            id: item.id || Date.now().toString() + Math.random().toString().slice(2, 6),
                            date: item.date || new Date().toISOString().slice(0, 10),
                            platform: item.platform || '未指定',
                            asset: item.asset || '未指定',
                            quantity: parseFloat(item.quantity) || 0,
                            strategy: item.strategy || '其他/隨意進場',
                            pnl: parseFloat(item.pnl) !== undefined ? parseFloat(item.pnl) : (parseFloat(item.netPnL) || 0),
                            entryTime: item.entryTime || '',
                            exitTime: item.exitTime || '',
                            entryPrice: parseFloat(item.entryPrice) || 0,
                            exitPrice: parseFloat(item.exitPrice) || 0,
                            note: item.note || '',
                            imageBase64: item.imageBase64 || ''
                        }));

                        saveData();
                        alert('成功匯入資料並已同步！');
                    } else {
                        alert('匯入失敗：JSON 格式不符。');
                    }
                } catch (err) {
                    alert('讀取檔案失敗，請確定是否為正確的 JSON 格式檔案。');
                }
                e.target.value = '';
            };
            reader.readAsText(file);
        }

        function openNoteModal(id) {
            const record = records.find(r => r.id === id);
            if (!record) return;

            document.getElementById('modalDateAsset').textContent = `${record.date} (${record.entryTime || '--:--'} ~ ${record.exitTime || '--:--'}) | ${record.platform} - ${record.asset}`;
            document.getElementById('modalNoteContent').textContent = record.note || '無備註說明';
            
            const imgContainer = document.getElementById('modalImageContainer');
            const modalImg = document.getElementById('modalImage');
            if (record.imageBase64) {
                modalImg.src = record.imageBase64;
                imgContainer.classList.remove('hidden');
            } else {
                modalImg.src = '';
                imgContainer.classList.add('hidden');
            }

            document.getElementById('noteModal').classList.remove('hidden');
        }

        function closeNoteModal() {
            document.getElementById('noteModal').classList.add('hidden');
        }

        // 5. 畫面渲染與指標數據計算
        function renderApp() {
            const selectedMonth = document.getElementById('monthFilter').value;
            
            const filteredRecords = selectedMonth 
                ? records.filter(r => r.date && r.date.startsWith(selectedMonth))
                : records;

            const sortedRecords = [...filteredRecords].sort((a, b) => new Date(b.date) - new Date(a.date));

            let totalNetPnL = 0;
            let winCount = 0;
            let lossCount = 0;
            let totalWinAmount = 0;
            let totalLossAmount = 0;
            const platformPnLMap = {};

            filteredRecords.forEach(r => {
                const net = r.pnl; // 直接採用淨損益
                totalNetPnL += net;

                if (net > 0) {
                    winCount++;
                    totalWinAmount += net;
                } else if (net < 0) {
                    lossCount++;
                    totalLossAmount += Math.abs(net);
                }

                platformPnLMap[r.platform] = (platformPnLMap[r.platform] || 0) + net;
            });

            const totalCount = filteredRecords.length;
            const winRate = totalCount > 0 ? ((winCount / totalCount) * 100).toFixed(1) : '0.0';

            const avgWin = winCount > 0 ? (totalWinAmount / winCount) : 0;
            const avgLoss = lossCount > 0 ? (totalLossAmount / lossCount) : 0;
            const payoffRatio = avgLoss > 0 ? (avgWin / avgLoss).toFixed(2) : (avgWin > 0 ? '∞' : '0.00');

            const winProb = totalCount > 0 ? (winCount / totalCount) : 0;
            const lossProb = totalCount > 0 ? (lossCount / totalCount) : 0;
            const ev = Math.round((winProb * avgWin) - (lossProb * avgLoss));

            const pnlElem = document.getElementById('statMonthlyPnL');
            pnlElem.textContent = `$ ${totalNetPnL.toLocaleString()}`;
            pnlElem.className = `text-xl font-extrabold mt-1 block ${totalNetPnL >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;

            document.getElementById('statWinRate').textContent = `${winRate} %`;
            document.getElementById('statTotalCount').textContent = `${totalCount} 筆`;
            document.getElementById('statPayoffRatio').textContent = payoffRatio;
            
            const evElem = document.getElementById('statEV');
            evElem.textContent = `$ ${ev.toLocaleString()}`;
            evElem.className = `text-xl font-bold mt-1 block ${ev >= 0 ? 'text-sky-400' : 'text-rose-400'}`;

            // 渲染明細清單
            const tableBody = document.getElementById('recordsTableBody');
            if (sortedRecords.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-slate-500">尚無交易紀錄</td></tr>`;
            } else {
                tableBody.innerHTML = sortedRecords.map(r => {
                    const netPnL = r.pnl;
                    const pnlClass = netPnL >= 0 ? 'text-emerald-400' : 'text-rose-400';
                    const timeDisplay = (r.entryTime || r.exitTime) ? `${r.entryTime || '--:--'} ~ ${r.exitTime || '--:--'}` : '-';
                    const priceDisplay = (r.entryPrice || r.exitPrice) ? `$${r.entryPrice || 0} / $${r.exitPrice || 0}` : '-';
                    const qtyDisplay = r.quantity ? `(${r.quantity})` : '';

                    const noteText = r.note ? r.note : '-';
                    const hasImage = Boolean(r.imageBase64);
                    const isLongNote = (r.note && r.note.length > 8) || hasImage;

                    return `
                        <tr class="hover:bg-slate-700/30 transition">
                            <td class="py-3 px-3 font-mono text-slate-300">${r.date}</td>
                            <td class="py-3 px-3"><span class="bg-slate-700 text-slate-300 text-xs px-2 py-1 rounded border border-slate-600">${r.platform}</span></td>
                            <td class="py-3 px-3">
                                <div class="font-medium text-white">${r.asset} <span class="text-xs text-amber-300 font-mono">${qtyDisplay}</span></div>
                                <div class="text-xs text-indigo-400">${r.strategy || '未指定'}</div>
                            </td>
                            <td class="py-3 px-3 text-center font-mono text-xs">
                                <div class="text-slate-300">${timeDisplay}</div>
                                <div class="text-slate-400">${priceDisplay}</div>
                            </td>
                            <td class="py-3 px-3 text-right font-mono font-bold ${pnlClass}">${netPnL > 0 ? '+' : ''}${netPnL.toLocaleString()}</td>
                            <td class="py-3 px-3 text-slate-400 text-xs max-w-[140px]">
                                ${isLongNote ? `
                                    <button onclick="openNoteModal('${r.id}')" class="text-left text-emerald-400 hover:underline truncate w-full block flex items-center gap-1">
                                        ${hasImage ? '📷' : ''} 🔍 ${r.note ? r.note.slice(0, 6) + '...' : '查看截圖'}
                                    </button>
                                ` : `
                                    <span class="truncate block" title="${noteText}">${noteText}</span>
                                `}
                            </td>
                            <td class="py-3 px-3 text-center space-x-2">
                                <button onclick="editRecord('${r.id}')" class="text-slate-400 hover:text-emerald-400 transition text-xs">編輯</button>
                                <button onclick="deleteRecord('${r.id}')" class="text-slate-500 hover:text-rose-400 transition text-xs">刪除</button>
                            </td>
                        </tr>
                    `;
                }).join('');
            }

            renderPlatformChart(platformPnLMap);
            renderDailyCumulativeChart(filteredRecords);
        }

        // 6. 繪製圖表
        function renderPlatformChart(platformData) {
            const ctx = document.getElementById('platformChart').getContext('2d');
            const labels = Object.keys(platformData);
            const dataValues = Object.values(platformData);

            if (chartInstance) chartInstance.destroy();

            const backgroundColors = dataValues.map(val => val >= 0 ? 'rgba(52, 211, 153, 0.7)' : 'rgba(251, 113, 133, 0.7)');

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '平台淨損益 (NTD)',
                        data: dataValues,
                        backgroundColor: backgroundColors,
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { color: '#94a3b8' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#94a3b8' }
                        }
                    }
                }
            });
        }

        function renderDailyCumulativeChart(filteredRecords) {
            const ctx = document.getElementById('dailyCumulativeChart').getContext('2d');
            
            const sorted = [...filteredRecords].sort((a, b) => new Date(a.date) - new Date(b.date));
            const dailyMap = {};
            sorted.forEach(r => {
                const net = r.pnl;
                dailyMap[r.date] = (dailyMap[r.date] || 0) + net;
            });

            let cumulative = 0;
            const dates = [];
            const cumulativeValues = [];

            Object.keys(dailyMap).sort().forEach(date => {
                cumulative += dailyMap[date];
                dates.push(date);
                cumulativeValues.push(cumulative);
            });

            if (dailyCumulativeChartInstance) dailyCumulativeChartInstance.destroy();

            dailyCumulativeChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [{
                        label: '累積資金曲線 (NTD)',
                        data: cumulativeValues,
                        borderColor: 'rgba(52, 211, 153, 1)',
                        backgroundColor: 'rgba(52, 211, 153, 0.1)',
                        fill: true,
                        tension: 0.1,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { color: '#94a3b8' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#94a3b8' }
                        }
                    }
                }
            });
        }
    </script>
</body>
